<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Meu Treino 🌸</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56;
      --blue: #378ADD; --blue-light: #E6F1FB; --blue-dark: #185FA5;
      --amber: #EF9F27; --amber-light: #FAEEDA; --amber-dark: #854F0B;
      --pink: #D4537E; --pink-light: #FBEAF0; --pink-dark: #993556;
      --bg: #f7f6f3; --surface: #ffffff; --surface2: #f1efe8;
      --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
      --text: #1a1a18; --text2: #6b6a66; --text3: #9e9d99;
      --radius: 12px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18; --surface: #242422; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
        --text: #f1efe8; --text2: #9e9d99; --text3: #6b6a66;
        --green-light: #0d3d2e; --blue-light: #0c2540;
        --amber-light: #3d2a05; --pink-light: #3d1428;
      }
    }
    html, body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    .app { max-width: 420px; margin: 0 auto; padding: 16px 14px; min-height: 100dvh; }
    .screen { display: none; }
    .screen.active { display: block; }

    .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 500; color: var(--text); }
    .header-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .back-btn { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text2); background: none; border: none; cursor: pointer; padding: 4px; font-family: inherit; }

    .level-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 500; margin-bottom: 10px; }
    .lv-1-badge { background: var(--green-light); color: var(--green-dark); }
    .lv-2-badge { background: var(--blue-light); color: var(--blue-dark); }
    .lv-3-badge { background: var(--amber-light); color: var(--amber-dark); }
    .lv-4-badge { background: var(--pink-light); color: var(--pink-dark); }
    .level-bar-wrap { background: var(--surface2); border-radius: 99px; height: 5px; margin-bottom: 4px; overflow: hidden; }
    .level-bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s; }
    .lv-1-bar { background: var(--green); } .lv-2-bar { background: var(--blue); }
    .lv-3-bar { background: var(--amber); } .lv-4-bar { background: var(--pink); }
    .level-hint { font-size: 11px; color: var(--text3); margin-bottom: 16px; }

    .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat-card { flex: 1; background: var(--surface2); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 500; color: var(--text); }
    .stat-label { font-size: 10px; color: var(--text2); margin-top: 2px; }

    .calendar-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-nav { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 18px; padding: 2px 6px; border-radius: 4px; line-height: 1; }
    .cal-nav:hover { background: var(--surface2); }
    .cal-month { font-size: 14px; font-weight: 500; color: var(--text); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dn { font-size: 10px; color: var(--text3); text-align: center; padding: 2px 0; font-weight: 500; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 50%; color: var(--text2); }
    .cal-day.today { color: var(--text); font-weight: 500; border: 1.5px solid var(--border2); }
    .cal-day.lv1 { background: var(--green); color: white; font-weight: 500; }
    .cal-day.lv2 { background: var(--blue); color: white; font-weight: 500; }
    .cal-day.lv3 { background: var(--amber); color: white; font-weight: 500; }
    .cal-day.lv4 { background: var(--pink); color: white; font-weight: 500; }

    .start-btn { width: 100%; padding: 14px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; transition: opacity 0.15s; font-family: inherit; margin-bottom: 12px; }
    .start-btn:hover { opacity: 0.9; }
    .lv-1-btn { background: var(--green); } .lv-2-btn { background: var(--blue); }
    .lv-3-btn { background: var(--amber); } .lv-4-btn { background: var(--pink); }

    /* Edit calendar */
    .cal-edit-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-edit-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); background: var(--surface2); border: 0.5px solid var(--border); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .cal-edit-btn:hover { background: var(--border); }
    .cal-edit-btn.editing { background: var(--green-light); color: var(--green-dark); border-color: var(--green); }
    .edit-hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 10px; padding: 8px; background: var(--surface2); border-radius: var(--radius-sm); }
    .cal-day.editable { cursor: pointer; }
    .cal-day.editable:hover { opacity: 0.75; transform: scale(1.1); transition: all 0.1s; }
    .cal-day.editable.future { opacity: 0.35; cursor: not-allowed; }

    /* Day edit modal */
    .day-modal-date { font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .day-modal-status { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .day-modal-btns { display: flex; flex-direction: column; gap: 8px; }
    .day-add-btn { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; }
    .day-del-btn { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text2); background: var(--surface2); }
    .day-del-btn:hover { background: #FCEBEB; color: #A32D2D; border-color: #F09595; }
    .day-cancel-btn { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: none; font-size: 13px; cursor: pointer; font-family: inherit; color: var(--text3); background: none; margin-top: 4px; }

    /* Workout */
    .progress-bar-wrap { background: var(--surface2); border-radius: 99px; height: 4px; margin-bottom: 14px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
    .video-area { background: var(--surface2); border-radius: var(--radius); aspect-ratio: 16/9; margin-bottom: 12px; overflow: hidden; }
    .video-area iframe { width: 100%; height: 100%; border: none; }

    /* Exercise info row: video left, muscle SVG right */
    .ex-info-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
    .ex-text-block { flex: 1; }
    .ex-muscle-tag { display: inline-block; font-size: 11px; font-weight: 500; border-radius: 99px; padding: 3px 10px; margin-bottom: 6px; }
    .lv-1-muscle { background: var(--green-light); color: var(--green-dark); }
    .lv-2-muscle { background: var(--blue-light); color: var(--blue-dark); }
    .lv-3-muscle { background: var(--amber-light); color: var(--amber-dark); }
    .lv-4-muscle { background: var(--pink-light); color: var(--pink-dark); }
    .ex-name { font-size: 17px; font-weight: 500; color: var(--text); margin-bottom: 4px; line-height: 1.25; }
    .ex-desc { font-size: 12px; color: var(--text2); line-height: 1.55; margin-bottom: 6px; }
    .ex-tip { font-size: 11px; color: var(--text3); font-style: italic; }
    .muscle-svg-wrap { width: 90px; flex-shrink: 0; }
    .muscle-svg-wrap svg { width: 90px; height: auto; display: block; }

    /* Swap button — below the info */
    .swap-btn { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--text2); background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px; cursor: pointer; font-family: inherit; width: 100%; margin-top: 12px; transition: all 0.15s; }
    .swap-btn:hover { background: var(--border); }

    .next-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; margin-top: 16px; }
    .next-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .next-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; display: flex; align-items: center; gap: 10px; }
    .next-ico { width: 30px; height: 30px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .next-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .next-sub { font-size: 11px; color: var(--text2); }
    .action-btn { width: 100%; padding: 13px; border-radius: var(--radius); color: white; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; }
    .action-btn:hover { opacity: 0.9; }

    /* Swap modal with image */
    .alt-option { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: var(--surface); }
    .alt-option:hover { border-color: var(--border2); background: var(--surface2); }
    .alt-option.selected { border-color: var(--green); background: var(--green-light); }
    .alt-thumb { width: 64px; height: 48px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--surface2); position: relative; }
    .alt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .alt-thumb-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text3); }
    .alt-info { flex: 1; min-width: 0; }
    .alt-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
    .alt-muscle { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .alt-check { margin-left: auto; font-size: 18px; color: var(--green); display: none; flex-shrink: 0; }
    .alt-option.selected .alt-check { display: block; }

    /* Swap modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px 32px; width: 100%; max-width: 420px; transform: translateY(30px); transition: transform 0.25s; }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    .modal-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 16px; }
    .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 99px; margin: 0 auto 16px; }
    .alt-option { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: var(--surface); }
    .alt-option:hover { border-color: var(--border2); background: var(--surface2); }
    .alt-option.selected { border-color: var(--green); background: var(--green-light); }
    .alt-option.selected.sel-2 { border-color: var(--blue); background: var(--blue-light); }
    .alt-option.selected.sel-3 { border-color: var(--amber); background: var(--amber-light); }
    .alt-option.selected.sel-4 { border-color: var(--pink); background: var(--pink-light); }
    .alt-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text2); flex-shrink: 0; }
    .alt-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .alt-muscle { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .alt-check { margin-left: auto; font-size: 18px; color: var(--green); display: none; }
    .alt-option.selected .alt-check { display: block; }
    .modal-confirm { width: 100%; padding: 13px; border-radius: var(--radius); color: white; border: none; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 4px; }

    /* Done screen */
    .done-wrap { text-align: center; padding: 20px 0; }
    .done-icon { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 30px; }
    .lv-1-icon { background: var(--green-light); color: var(--green); }
    .lv-2-icon { background: var(--blue-light); color: var(--blue); }
    .lv-3-icon { background: var(--amber-light); color: var(--amber); }
    .lv-4-icon { background: var(--pink-light); color: var(--pink); }
    .done-title { font-size: 21px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
    .done-sub { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }
    .levelup-banner { border-radius: var(--radius); padding: 14px; margin-bottom: 16px; text-align: center; }
    .lu-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .lu-sub { font-size: 12px; }
    .done-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .done-stat { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
    .done-stat-num { font-size: 20px; font-weight: 500; color: var(--text); }
    .done-stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  </style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="header">
      <div><h1>Meu Treino 🌸</h1><div class="header-sub">Academia do prédio</div></div>
    </div>
    <div id="level-badge-wrap"></div>
    <div class="level-bar-wrap"><div class="level-bar-fill" id="level-fill"></div></div>
    <div class="level-hint" id="level-hint"></div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="streak-count">0</div><div class="stat-label">dias seguidos</div></div>
      <div class="stat-card"><div class="stat-num" id="total-count">0</div><div class="stat-label">treinos feitos</div></div>
      <div class="stat-card"><div class="stat-num" id="level-count">1</div><div class="stat-label">nível atual</div></div>
    </div>
    <button class="start-btn" id="start-btn" onclick="startWorkout()">
      <i class="ti ti-player-play"></i><span>Começar treino de hoje</span>
    </button>
    <div class="calendar-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:4px;">
          <button class="cal-nav" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
          <span class="cal-month" id="cal-month-label"></span>
          <button class="cal-nav" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
        </div>
        <button class="cal-edit-btn" id="edit-cal-btn" onclick="toggleEditMode()">
          <i class="ti ti-pencil"></i> <span id="edit-btn-label">editar</span>
        </button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="edit-hint" id="edit-hint" style="display:none">Toque em qualquer dia para adicionar ou remover um treino</div>
    </div>
  </div>

  <!-- WORKOUT -->
  <div id="screen-workout" class="screen">
    <div class="header">
      <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> voltar</button>
      <span style="font-size:12px;color:var(--text3)" id="workout-prog">1 / 8</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
    <div class="video-area" id="video-area"></div>

    <div class="ex-info-row">
      <div class="ex-text-block">
        <span class="ex-muscle-tag" id="ex-muscle"></span>
        <div class="ex-name" id="ex-name"></div>
        <div class="ex-desc" id="ex-desc"></div>
        <div class="ex-tip" id="ex-tip"></div>
      </div>
      <div class="muscle-svg-wrap" id="muscle-svg-wrap"></div>
    </div>

    <button class="swap-btn" onclick="openSwap()">
      <i class="ti ti-switch-2"></i> trocar exercício
    </button>

    <div class="next-label" style="margin-top:16px">próximos exercícios</div>
    <div class="next-list" id="next-list"></div>
    <button class="action-btn" id="next-btn" onclick="nextExercise()">
      Próximo <i class="ti ti-arrow-right"></i>
    </button>
  </div>

  <!-- DONE -->
  <div id="screen-done" class="screen">
    <div class="done-wrap">
      <div class="done-icon" id="done-icon"><i class="ti ti-check"></i></div>
      <div class="done-title">Treino concluído! 🎉</div>
      <div class="done-sub" id="done-sub"></div>
      <div id="levelup-banner"></div>
      <div class="done-stats">
        <div class="done-stat"><div class="done-stat-num" id="dn-ex">8</div><div class="done-stat-label">exercícios</div></div>
        <div class="done-stat"><div class="done-stat-num" id="dn-sets">-</div><div class="done-stat-label">séries</div></div>
        <div class="done-stat"><div class="done-stat-num" id="dn-reps">-</div><div class="done-stat-label">repetições</div></div>
        <div class="done-stat"><div class="done-stat-num" id="dn-time">-</div><div class="done-stat-label">minutos</div></div>
      </div>
      <button class="action-btn" id="done-btn" onclick="finishAndGoHome()">Ver calendário</button>
    </div>
  </div>

</div>

<!-- SWAP MODAL -->
<div class="modal-overlay" id="swap-modal" onclick="closeSwapOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Trocar exercício</div>
    <div class="modal-sub">Escolha uma das opções abaixo:</div>
    <div id="alt-list"></div>
    <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmSwap()">Confirmar escolha</button>
  </div>
</div>

<!-- DAY EDIT MODAL -->
<div class="modal-overlay" id="day-modal" onclick="closeDayModalOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="day-modal-date" id="day-modal-date"></div>
    <div class="day-modal-status" id="day-modal-status"></div>
    <div class="day-modal-btns" id="day-modal-btns"></div>
    <button class="day-cancel-btn" onclick="closeDayModal()">cancelar</button>
  </div>
</div>

<script>
const LEVELS = [
  { num:1, name:"Iniciante",     emoji:"🌱", min:0,  max:20,  sets:3, reps:12, bar:"lv-1-bar", badge:"lv-1-badge", btn:"lv-1-btn", muscle:"lv-1-muscle", icon:"lv-1-icon", setDone:"done",   cal:"lv1", barColor:"#1D9E75" },
  { num:2, name:"Intermediário", emoji:"💪", min:20, max:40,  sets:4, reps:12, bar:"lv-2-bar", badge:"lv-2-badge", btn:"lv-2-btn", muscle:"lv-2-muscle", icon:"lv-2-icon", setDone:"done-2", cal:"lv2", barColor:"#378ADD" },
  { num:3, name:"Avançado",      emoji:"🔥", min:40, max:60,  sets:4, reps:15, bar:"lv-3-bar", badge:"lv-3-badge", btn:"lv-3-btn", muscle:"lv-3-muscle", icon:"lv-3-icon", setDone:"done-3", cal:"lv3", barColor:"#EF9F27" },
  { num:4, name:"Expert",        emoji:"⚡", min:60, max:999, sets:5, reps:15, bar:"lv-4-bar", badge:"lv-4-badge", btn:"lv-4-btn", muscle:"lv-4-muscle", icon:"lv-4-icon", setDone:"done-4", cal:"lv4", barColor:"#D4537E" },
];

// Each exercise slot has "options": array of 3 alternatives the user can pick from
const EXERCISES = [
  // NÍVEL 1 — Iniciante
  [
    { options: [

let st = {
  ex: 0,
  sets: [],
  // chosen[lvIdx][slotIdx] = optionIndex (0, 1 or 2)
  chosen: [
    Array(8).fill(0),
    Array(8).fill(0),
    Array(8).fill(0),
    Array(8).fill(0),
  ],
  done: JSON.parse(localStorage.getItem('meu_treino_v3') || '[]'),
  calOff: 0,
  t0: null,
  swapIdx: null,
  swapChosen: 0,
};

function save() { localStorage.setItem('meu_treino_v3', JSON.stringify(st.done)); }
function total() { return st.done.length; }
function getLv() { const t=total(); for(let i=LEVELS.length-1;i>=0;i--) if(t>=LEVELS[i].min) return LEVELS[i]; return LEVELS[0]; }
function todayKey() { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function isToday(y,m,d) { const n=new Date(); return n.getFullYear()===y&&n.getMonth()===m&&n.getDate()===d; }
function getDoneLv(y,m,d) { const k=`${y}-${m}-${d}`; const e=st.done.find(x=>(typeof x==='string'?x:x.k)===k); if(!e) return null; return typeof e==='string'?1:e.lv; }
function getExercise(lvNum, slotIdx) {
  const slot = EXERCISES[lvNum-1][slotIdx];
  const chosen = st.chosen[lvNum-1][slotIdx] || 0;
  return slot.options[chosen];
}

function changeMonth(dir) { st.calOff+=dir; renderCal(); }
function renderCal() {
  const now=new Date();
  const tg=new Date(now.getFullYear(),now.getMonth()+st.calOff,1);
  const y=tg.getFullYear(); const m=tg.getMonth();
  const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-month-label').textContent=`${months[m]} ${y}`;
  const fd=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate();
  const g=document.getElementById('cal-grid'); g.innerHTML='';
  ['D','S','T','Q','Q','S','S'].forEach(n=>{const el=document.createElement('div');el.className='cal-dn';el.textContent=n;g.appendChild(el);});
  for(let i=0;i<fd;i++){const el=document.createElement('div');el.className='cal-day';g.appendChild(el);}
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(let d=1;d<=dim;d++){
    const el=document.createElement('div');el.className='cal-day';el.textContent=d;
    if(isToday(y,m,d)) el.classList.add('today');
    const lv=getDoneLv(y,m,d); if(lv) el.classList.add(`lv${lv}`);
    if(editMode){
      const thisDay=new Date(y,m,d);
      if(thisDay>today){ el.classList.add('editable','future'); }
      else { el.classList.add('editable'); const dd=d; el.onclick=()=>openDayModal(y,m,dd); }
    }
    g.appendChild(el);
  }
}

function updateHome() {
  const t=total(); const lv=getLv();
  document.getElementById('total-count').textContent=t;
  document.getElementById('level-count').textContent=lv.num;
  let streak=0; const now=new Date();
  for(let i=0;i<365;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);if(getDoneLv(d.getFullYear(),d.getMonth(),d.getDate()))streak++;else break;}
  document.getElementById('streak-count').textContent=streak;
  document.getElementById('level-badge-wrap').innerHTML=`<div class="level-badge ${lv.badge}">${lv.emoji} Nível ${lv.num} — ${lv.name}</div>`;
  const fill=document.getElementById('level-fill'); fill.className=`level-bar-fill ${lv.bar}`;
  const range=lv.max-lv.min; const done=t-lv.min;
  fill.style.width=(lv.num===4?100:Math.min(100,Math.round((done/range)*100)))+'%';
  document.getElementById('level-hint').textContent=lv.num<4?`${Math.max(0,lv.max-t)} treinos para o nível ${lv.num+1}`:'Você chegou ao nível máximo! 🏆';
  document.getElementById('start-btn').className=`start-btn ${lv.btn}`;
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){show('screen-home');renderCal();updateHome();}

function startWorkout(){
  st.ex=0; const lv=getLv();
  st.sets=EXERCISES[lv.num-1].map(()=>[]);
  st.t0=Date.now(); show('screen-workout'); renderEx();
}

function getMuscleSVG(muscle) {
  const svg = MUSCLE_SVG[muscle];
  if (svg) return svg;
  // fallback: search partial match
  for (const key of Object.keys(MUSCLE_SVG)) {
    if (muscle.includes(key) || key.includes(muscle.split('+')[0].trim())) return MUSCLE_SVG[key];
  }
  return MUSCLE_SVG['Abdômen'];
}

function renderEx(){
  const lv=getLv(); const idx=st.ex; const total=EXERCISES[lv.num-1].length;
  const ex=getExercise(lv.num, idx);
  document.getElementById('workout-prog').textContent=`${idx+1} / ${total}`;
  const bar=document.getElementById('progress-bar'); bar.style.width=`${((idx+1)/total)*100}%`; bar.style.background=lv.barColor;
  const ms=document.getElementById('ex-muscle'); ms.className=`ex-muscle-tag ${lv.muscle}`; ms.textContent=ex.muscle;
  document.getElementById('ex-name').textContent=ex.name;
  document.getElementById('ex-desc').textContent=ex.desc;
  document.getElementById('ex-tip').textContent=ex.tip||'';
  document.getElementById('video-area').innerHTML=`<iframe src="https://www.youtube.com/embed/${ex.yt}?rel=0&modestbranding=1" title="${ex.name}" allowfullscreen></iframe>`;
  document.getElementById('muscle-svg-wrap').innerHTML=getMuscleSVG(ex.muscle);
  const nl=document.getElementById('next-list'); nl.innerHTML='';
  for(let i=idx+1;i<Math.min(idx+4,total);i++){
    const nex=getExercise(lv.num,i); const item=document.createElement('div'); item.className='next-item';
    item.innerHTML=`<div class="next-ico"><i class="ti ${nex.icon}"></i></div><div><div class="next-name">${nex.name}</div><div class="next-sub">${nex.muscle} · ${lv.sets}×${lv.reps}</div></div>`;
    nl.appendChild(item);
  }
  if(!nl.innerHTML) nl.innerHTML='<div style="font-size:13px;color:var(--text3);padding:6px 0">Último exercício!</div>';
  const btn=document.getElementById('next-btn'); btn.className=`action-btn ${lv.btn}`;
  if(idx===total-1){btn.innerHTML='Concluir treino <i class="ti ti-check"></i>';btn.onclick=concludeWorkout;}
  else{btn.innerHTML='Próximo <i class="ti ti-arrow-right"></i>';btn.onclick=nextExercise;}
}

function toggleSet(ei,sn){const s=st.sets[ei];const p=s.indexOf(sn);if(p>=0)s.splice(p,1);else s.push(sn);renderEx();}
function nextExercise(){const lv=getLv();if(st.ex<EXERCISES[lv.num-1].length-1){st.ex++;renderEx();window.scrollTo(0,0);}}

// ── Swap modal ──
function openSwap(){
  const lv=getLv(); const idx=st.ex;
  const slot=EXERCISES[lv.num-1][idx];
  const currentChosen=st.chosen[lv.num-1][idx]||0;
  st.swapIdx=idx; st.swapChosen=currentChosen;
  const list=document.getElementById('alt-list'); list.innerHTML='';
  slot.options.forEach((opt,i)=>{
    const div=document.createElement('div');
    div.className='alt-option'+(i===currentChosen?' selected':'');
    const thumbUrl=`https://img.youtube.com/vi/${opt.yt}/mqdefault.jpg`;
    div.innerHTML=`
      <div class="alt-thumb">
        <img src="${thumbUrl}" alt="${opt.name}" onerror="this.parentElement.innerHTML='<div class=alt-thumb-fallback><i class=\\"ti ${opt.icon}\\"></i></div>'">
      </div>
      <div class="alt-info">
        <div class="alt-name">${opt.name}${i===0?' <span style="font-size:10px;color:var(--text3)">(padrão)</span>':''}</div>
        <div class="alt-muscle">${opt.muscle}</div>
      </div>
      <i class="ti ti-check alt-check"></i>`;
    div.onclick=()=>selectAlt(i);
    list.appendChild(div);
  });
  const confirmBtn=document.getElementById('modal-confirm-btn');
  confirmBtn.className=`modal-confirm ${lv.btn}`;
  document.getElementById('swap-modal').classList.add('open');
}

function selectAlt(i){
  st.swapChosen=i;
  document.querySelectorAll('.alt-option').forEach((el,idx)=>{
    el.className='alt-option'+(idx===i?' selected':'');
  });
}

function confirmSwap(){
  const lv=getLv();
  st.chosen[lv.num-1][st.swapIdx]=st.swapChosen;
  st.sets[st.swapIdx]=[];
  closeSwap(); renderEx();
}

function closeSwap(){document.getElementById('swap-modal').classList.remove('open');}
function closeSwapOutside(e){if(e.target===document.getElementById('swap-modal'))closeSwap();}

function concludeWorkout(){
  const lv=getLv(); const k=todayKey();
  const already=st.done.find(e=>(typeof e==='string'?e:e.k)===k);
  if(!already){st.done.push({k,lv:lv.num});save();}
  const newLv=getLv(); const leveled=newLv.num>lv.num;
  const elapsed=Math.round((Date.now()-st.t0)/60000)||'~30';
  const exs=EXERCISES[lv.num-1];
  document.getElementById('dn-ex').textContent=exs.length;
  document.getElementById('dn-sets').textContent=lv.sets*exs.length;
  document.getElementById('dn-reps').textContent=lv.sets*lv.reps*exs.length;
  document.getElementById('dn-time').textContent=elapsed;
  document.getElementById('done-icon').className=`done-icon ${lv.icon}`;
  const luColors=['','#E6F1FB','#FAEEDA','#FBEAF0']; const luText=['','#185FA5','#854F0B','#993556'];
  const banner=document.getElementById('levelup-banner');
  if(leveled){banner.innerHTML=`<div class="levelup-banner" style="background:${luColors[newLv.num-1]}"><div class="lu-title" style="color:${luText[newLv.num-1]}">🎉 Você subiu para o nível ${newLv.num}!</div><div class="lu-sub" style="color:${luText[newLv.num-1]}">${newLv.emoji} ${newLv.name} — novos desafios te esperam!</div></div>`;}
  else banner.innerHTML='';
  const subs=['','Parabéns! Continue construindo o hábito. 🌱','Você está ficando mais forte a cada treino. 💪','Incrível! Você já é uma atleta de verdade! 🔥','Nível máximo atingido. Você é expert! ⚡'];
  document.getElementById('done-sub').textContent=subs[lv.num];
  const db=document.getElementById('done-btn'); db.className=`action-btn ${lv.btn}`;
  show('screen-done');
}

let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('edit-cal-btn');
  const lbl = document.getElementById('edit-btn-label');
  const hint = document.getElementById('edit-hint');
  if (editMode) {
    btn.classList.add('editing');
    lbl.textContent = 'concluir';
    hint.style.display = 'block';
  } else {
    btn.classList.remove('editing');
    lbl.textContent = 'editar';
    hint.style.display = 'none';
  }
  renderCal();
}

function openDayModal(y, m, d) {
  if (!editMode) return;
  const now = new Date();
  const isFuture = new Date(y, m, d) > new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (isFuture) return;

  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const doneLv = getDoneLv(y, m, d);

  document.getElementById('day-modal-date').textContent = `${d} de ${months[m]} de ${y}`;
  const statusEl = document.getElementById('day-modal-status');
  const btnsEl = document.getElementById('day-modal-btns');

  if (doneLv) {
    const lvName = LEVELS[doneLv-1].name;
    statusEl.textContent = `✅ Treino de nível ${doneLv} (${lvName}) registrado neste dia.`;
    btnsEl.innerHTML = `<button class="day-del-btn" onclick="removeDay(${y},${m},${d})"><i class="ti ti-trash"></i> Remover treino deste dia</button>`;
  } else {
    statusEl.textContent = 'Nenhum treino registrado neste dia.';
    const lv = getLv();
    btnsEl.innerHTML = LEVELS.map(l =>
      `<button class="day-add-btn ${l.btn}" onclick="addDay(${y},${m},${d},${l.num})"><i class="ti ti-plus"></i> Adicionar como nível ${l.num} — ${l.name}</button>`
    ).join('');
  }

  document.getElementById('day-modal').classList.add('open');
}

function addDay(y, m, d, lvNum) {
  const k = `${y}-${m}-${d}`;
  const already = st.done.find(e => (typeof e==='string'?e:e.k) === k);
  if (!already) { st.done.push({k, lv: lvNum}); save(); }
  closeDayModal();
  renderCal(); updateHome();
}

function removeDay(y, m, d) {
  const k = `${y}-${m}-${d}`;
  st.done = st.done.filter(e => (typeof e==='string'?e:e.k) !== k);
  save();
  closeDayModal();
  renderCal(); updateHome();
}

function closeDayModal() { document.getElementById('day-modal').classList.remove('open'); }
function closeDayModalOutside(e) { if (e.target === document.getElementById('day-modal')) closeDayModal(); }

function finishAndGoHome(){goHome();}

st.done=st.done.map(e=>typeof e==='string'?{k:e,lv:1}:e);
renderCal(); updateHome();
</script>
