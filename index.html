<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Meu Treino 🌸</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Dark theme fixo */
      --bg: #0d0d0d;
      --surface: #181818;
      --surface2: #222222;
      --surface3: #2a2a2a;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.15);
      --text: #f0f0f0;
      --text2: #a0a0a0;
      --text3: #606060;
      --radius: 14px;
      --radius-sm: 10px;
      /* Pink como cor principal */
      --pink: #E8407A;
      --pink-light: rgba(232,64,122,0.15);
      --pink-dark: #c02860;
      --pink-glow: rgba(232,64,122,0.25);
      /* Cores por nível — todas variantes do mesmo universo */
      --lv1: #E8407A;   --lv1-bg: rgba(232,64,122,0.12);   --lv1-border: rgba(232,64,122,0.3);
      --lv2: #B066F0;   --lv2-bg: rgba(176,102,240,0.12);  --lv2-border: rgba(176,102,240,0.3);
      --lv3: #F06040;   --lv3-bg: rgba(240,96,64,0.12);    --lv3-border: rgba(240,96,64,0.3);
      --lv4: #F0A030;   --lv4-bg: rgba(240,160,48,0.12);   --lv4-border: rgba(240,160,48,0.3);
    }

    html, body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    .app { max-width: 420px; margin: 0 auto; padding: 20px 16px 32px; min-height: 100dvh; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── HOME ── */
    .home-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .home-title { font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -0.3px; }
    .home-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

    /* Level badge */
    .level-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 500; margin-bottom: 10px; letter-spacing: 0.02em; }
    .lv-1-badge { background: var(--lv1-bg); color: var(--lv1); border: 1px solid var(--lv1-border); }
    .lv-2-badge { background: var(--lv2-bg); color: var(--lv2); border: 1px solid var(--lv2-border); }
    .lv-3-badge { background: var(--lv3-bg); color: var(--lv3); border: 1px solid var(--lv3-border); }
    .lv-4-badge { background: var(--lv4-bg); color: var(--lv4); border: 1px solid var(--lv4-border); }
    .level-bar-wrap { background: var(--surface2); border-radius: 99px; height: 4px; margin-bottom: 4px; overflow: hidden; }
    .level-bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
    .lv-1-bar { background: var(--lv1); } .lv-2-bar { background: var(--lv2); }
    .lv-3-bar { background: var(--lv3); } .lv-4-bar { background: var(--lv4); }
    .level-hint { font-size: 11px; color: var(--text3); margin-bottom: 20px; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
    .stat-label { font-size: 10px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Start button — sempre pink */
    .start-btn { width: 100%; padding: 16px; border-radius: var(--radius); border: none; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; background: var(--pink); transition: all 0.15s; font-family: inherit; margin-bottom: 16px; letter-spacing: -0.2px; box-shadow: 0 4px 20px var(--pink-glow); }
    .start-btn:hover { background: var(--pink-dark); transform: translateY(-1px); box-shadow: 0 6px 24px var(--pink-glow); }
    .start-btn:active { transform: translateY(0); }
    .start-btn.resume { background: transparent; border: 1.5px solid var(--pink); color: var(--pink); box-shadow: none; }
    .start-btn.resume:hover { background: var(--pink-light); }

    /* Calendar */
    .calendar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .cal-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-nav-btns { display: flex; align-items: center; gap: 2px; }
    .cal-nav { background: var(--surface2); border: none; cursor: pointer; color: var(--text2); font-size: 14px; padding: 6px 10px; border-radius: 8px; line-height: 1; transition: all 0.1s; }
    .cal-nav:hover { background: var(--surface3); color: var(--text); }
    .cal-month { font-size: 14px; font-weight: 500; color: var(--text); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dn { font-size: 10px; color: var(--text3); text-align: center; padding: 3px 0; font-weight: 500; text-transform: uppercase; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 50%; color: var(--text3); transition: all 0.1s; }
    .cal-day.today { color: var(--text); font-weight: 600; border: 1.5px solid var(--border2); }
    .cal-day.lv1 { background: var(--lv1); color: white; font-weight: 500; }
    .cal-day.lv2 { background: var(--lv2); color: white; font-weight: 500; }
    .cal-day.lv3 { background: var(--lv3); color: white; font-weight: 500; }
    .cal-day.lv4 { background: var(--lv4); color: white; font-weight: 500; }
    .cal-edit-btn { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .cal-edit-btn:hover { color: var(--text2); border-color: var(--border2); }
    .cal-edit-btn.editing { background: var(--pink-light); color: var(--pink); border-color: var(--lv1-border); }
    .edit-hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 10px; padding: 8px; background: var(--surface2); border-radius: 8px; }
    .cal-day.editable { cursor: pointer; }
    .cal-day.editable:hover { opacity: 0.75; transform: scale(1.15); }
    .cal-day.editable.future { opacity: 0.2; cursor: not-allowed; }

    /* Day modal */
    .day-modal-date { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .day-modal-status { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .day-modal-btns { display: flex; flex-direction: column; gap: 8px; }
    .day-add-btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; background: var(--pink); }
    .day-del-btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 14px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text2); background: var(--surface2); }
    .day-del-btn:hover { background: rgba(220,50,50,0.12); color: #ff6b6b; border-color: rgba(220,50,50,0.3); }
    .day-cancel-btn { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: none; font-size: 13px; cursor: pointer; font-family: inherit; color: var(--text3); background: none; margin-top: 4px; }

    /* ── WORKOUT ── */
    .workout-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 7px 14px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .back-btn:hover { color: var(--text); border-color: var(--border2); }
    .workout-prog-wrap { display: flex; align-items: center; gap: 8px; }
    .workout-prog-text { font-size: 12px; color: var(--text3); white-space: nowrap; }
    .progress-bar-wrap { flex: 1; background: var(--surface2); border-radius: 99px; height: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }

    /* Video */
    .video-area { background: var(--surface2); border-radius: var(--radius); aspect-ratio: 16/9; margin-bottom: 14px; overflow: hidden; position: relative; }
    .video-area iframe { width: 100%; height: 100%; border: none; display: block; }

    /* Exercise card */
    .ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
    .ex-card-top { display: flex; gap: 12px; align-items: flex-start; }
    .ex-text-block { flex: 1; min-width: 0; }
    .ex-muscle-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; border-radius: 99px; padding: 3px 10px; margin-bottom: 7px; }
    .lv-1-muscle { background: var(--lv1-bg); color: var(--lv1); }
    .lv-2-muscle { background: var(--lv2-bg); color: var(--lv2); }
    .lv-3-muscle { background: var(--lv3-bg); color: var(--lv3); }
    .lv-4-muscle { background: var(--lv4-bg); color: var(--lv4); }
    .ex-name { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.2; letter-spacing: -0.3px; }
    .ex-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 6px; }
    .ex-tip { font-size: 11px; color: var(--text3); font-style: italic; padding: 6px 10px; background: var(--surface2); border-radius: 8px; border-left: 2px solid var(--border2); }
    .muscle-img-wrap { width: 80px; height: 100px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: var(--surface2); position: relative; }
    .muscle-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .muscle-img-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 3px 4px; font-size: 8px; color: rgba(255,255,255,0.9); text-align: center; font-weight: 500; line-height: 1.2; }

    /* Swap button */
    .swap-btn { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--pink); background: var(--pink-light); border: 1px solid var(--lv1-border); border-radius: 99px; padding: 9px 16px; cursor: pointer; font-family: inherit; transition: all 0.15s; margin: 0 auto 14px; }
    .swap-btn:hover { background: rgba(232,64,122,0.2); }
    .swap-btn:disabled, .swap-btn[style*="pointer-events: none"] { color: var(--text3); background: var(--surface2); border-color: var(--border); }

    /* Next exercises */
    .next-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; }
    .next-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
    .next-list { display: flex; flex-direction: column; gap: 6px; }
    .next-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--surface2); border-radius: var(--radius-sm); }
    .next-thumb { width: 48px; height: 36px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .next-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .next-name { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
    .next-sub { font-size: 10px; color: var(--text3); }
    .next-opts { display: flex; gap: 3px; margin-top: 4px; }
    .next-opt-btn { background: none; border: 1px solid var(--border); padding: 2px; cursor: pointer; border-radius: 5px; opacity: 0.5; transition: all 0.15s; }
    .next-opt-btn:hover { opacity: 1; border-color: var(--border2); }
    .next-opt-btn.active { opacity: 1; border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }

    /* Action button */
    .action-btn { width: 100%; padding: 15px; border-radius: var(--radius); color: white; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; letter-spacing: -0.2px; }
    .action-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .action-btn:active { transform: translateY(0); }
    /* Todos os níveis usam pink como primário */
    .lv-1-btn, .lv-2-btn, .lv-3-btn, .lv-4-btn { background: var(--pink); box-shadow: 0 4px 16px var(--pink-glow); }

    /* Swap modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(4px); }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px 36px; width: 100%; max-width: 420px; transform: translateY(40px); transition: transform 0.28s cubic-bezier(.4,0,.2,1); border-top: 1px solid var(--border); }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 99px; margin: 0 auto 18px; }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 16px; }
    .alt-option { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: var(--surface2); }
    .alt-option:hover { border-color: var(--border2); }
    .alt-option.selected { border-color: var(--pink); background: var(--pink-light); }
    .alt-thumb { width: 56px; height: 42px; border-radius: 7px; overflow: hidden; flex-shrink: 0; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .alt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .alt-info { flex: 1; min-width: 0; }
    .alt-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
    .alt-muscle { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .alt-check { margin-left: auto; font-size: 18px; color: var(--pink); display: none; flex-shrink: 0; }
    .alt-option.selected .alt-check { display: block; }
    .modal-confirm { width: 100%; padding: 14px; border-radius: var(--radius); color: white; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; background: var(--pink); box-shadow: 0 4px 16px var(--pink-glow); }

    /* Done screen */
    .done-wrap { text-align: center; padding: 24px 0; }
    .done-emoji { font-size: 56px; margin-bottom: 16px; line-height: 1; }
    .done-title { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -0.5px; }
    .done-sub { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 24px; padding: 0 12px; }
    .levelup-banner { background: var(--pink-light); border: 1px solid var(--lv1-border); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
    .lu-title { font-size: 15px; font-weight: 600; color: var(--pink); margin-bottom: 4px; }
    .lu-sub { font-size: 12px; color: var(--text2); }
    .done-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    .done-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
    .done-stat-num { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .done-stat-label { font-size: 11px; color: var(--text3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }
  </style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <div><div class="home-title">Meu Treino 🌸</div><div class="home-sub">Academia do prédio</div></div>
    </div>
    <div id="level-badge-wrap"></div>
    <div class="level-bar-wrap"><div class="level-bar-fill" id="level-fill"></div></div>
    <div class="level-hint" id="level-hint"></div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="streak-count">0</div><div class="stat-label">sequência</div></div>
      <div class="stat-card"><div class="stat-num" id="total-count">0</div><div class="stat-label">treinos</div></div>
      <div class="stat-card"><div class="stat-num" id="level-count">1</div><div class="stat-label">nível</div></div>
    </div>
    <button class="start-btn" id="start-btn" onclick="startWorkout()">
      <i class="ti ti-player-play"></i><span id="start-btn-label">Começar treino de hoje</span>
    </button>
    <div class="calendar-card">
      <div class="cal-nav-row">
        <div class="cal-nav-btns">
          <button class="cal-nav" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
          <span class="cal-month" id="cal-month-label" style="margin:0 8px"></span>
          <button class="cal-nav" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
        </div>
        <button class="cal-edit-btn" id="edit-cal-btn" onclick="toggleEditMode()">
          <i class="ti ti-pencil"></i> <span id="edit-btn-label">editar</span>
        </button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="edit-hint" id="edit-hint" style="display:none">Toque em qualquer dia para adicionar ou remover um treino</div>
    </div>
  </div>

  <!-- WORKOUT -->
  <div id="screen-workout" class="screen">
    <div class="workout-header">
      <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> voltar</button>
      <div class="workout-prog-wrap">
        <span class="workout-prog-text" id="workout-prog">1 / 8</span>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
      </div>
    </div>

    <div class="video-area" id="video-area"></div>

    <div class="ex-card">
      <div class="ex-card-top">
        <div class="ex-text-block">
          <span class="ex-muscle-tag" id="ex-muscle"></span>
          <div class="ex-name" id="ex-name"></div>
          <div class="ex-desc" id="ex-desc"></div>
        </div>
        <div class="muscle-img-wrap" id="muscle-svg-wrap"></div>
      </div>
      <div class="ex-tip" id="ex-tip" style="margin-top:10px"></div>
    </div>

    <div style="display:flex;justify-content:center;margin-bottom:14px">
      <button class="swap-btn" id="swap-btn" onclick="openSwap()">
        <i class="ti ti-switch-2"></i> trocar exercício
      </button>
    </div>

    <div class="next-section">
      <div class="next-label">Próximos</div>
      <div class="next-list" id="next-list"></div>
    </div>

    <button class="action-btn lv-1-btn" id="next-btn" onclick="nextExercise()">
      Próximo <i class="ti ti-arrow-right"></i>
    </button>
  </div>

  <!-- DONE -->
  <div id="screen-done" class="screen">
    <div class="done-wrap">
      <div class="done-emoji" id="done-emoji">🎉</div>
      <div class="done-title">Treino concluído!</div>
      <div class="done-sub" id="done-sub"></div>
      <div id="levelup-banner"></div>
      <div class="done-stats">
        <div class="done-stat"><div class="done-stat-num" id="dn-ex">8</div><div class="done-stat-label">exercícios</div></div>
        <div class="done-stat"><div class="done-stat-num" id="dn-sets">-</div><div class="done-stat-label">séries</div></div>
        <div class="done-stat"><div class="done-stat-num" id="dn-reps">-</div><div class="done-stat-label">repetições</div></div>
        <div class="done-stat"><div class="done-stat-num" id="dn-time">-</div><div class="done-stat-label">minutos</div></div>
      </div>
      <button class="action-btn lv-1-btn" id="done-btn" onclick="finishAndGoHome()">Ver meu progresso <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>

</div>

<!-- SWAP MODAL -->
<div class="modal-overlay" id="swap-modal" onclick="closeSwapOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Trocar exercício</div>
    <div class="modal-sub">Escolha uma das opções abaixo:</div>
    <div id="alt-list"></div>
    <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmSwap()">Confirmar escolha</button>
  </div>
</div>

<!-- DAY EDIT MODAL -->
<div class="modal-overlay" id="day-modal" onclick="closeDayModalOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="day-modal-date" id="day-modal-date"></div>
    <div class="day-modal-status" id="day-modal-status"></div>
    <div class="day-modal-btns" id="day-modal-btns"></div>
    <button class="day-cancel-btn" onclick="closeDayModal()">cancelar</button>
  </div>
</div>

// Session persistence: save mid-workout state for same-day resume
function saveSession() {
  if (st.t0 === null) return;
  const session = { ex: st.ex, sets: st.sets, chosen: st.chosen, t0: st.t0, day: todayKey() };
  localStorage.setItem('meu_treino_session', JSON.stringify(session));
}
function loadSession() {
  try {
    const raw = localStorage.getItem('meu_treino_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.day !== todayKey()) { localStorage.removeItem('meu_treino_session'); return null; }
    return s;
  } catch(e) { return null; }
}
function clearSession() { localStorage.removeItem('meu_treino_session'); }

let st = {
  ex: 0,
  sets: [],
  // chosen[lvIdx][slotIdx] = optionIndex (0, 1 or 2)
  chosen: [
    Array(8).fill(0),
    Array(8).fill(0),
    Array(8).fill(0),
    Array(8).fill(0),
  ],
  done: JSON.parse(localStorage.getItem('meu_treino_v3') || '[]'),
  calOff: 0,
  t0: null,
  swapIdx: null,
  swapChosen: 0,
  inProgress: false, // true while workout screen is active
};

function save() { localStorage.setItem('meu_treino_v3', JSON.stringify(st.done)); }
function total() { return st.done.length; }
function getLv() { const t=total(); for(let i=LEVELS.length-1;i>=0;i--) if(t>=LEVELS[i].min) return LEVELS[i]; return LEVELS[0]; }
function todayKey() { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function isToday(y,m,d) { const n=new Date(); return n.getFullYear()===y&&n.getMonth()===m&&n.getDate()===d; }
function getDoneLv(y,m,d) { const k=`${y}-${m}-${d}`; const e=st.done.find(x=>(typeof x==='string'?x:x.k)===k); if(!e) return null; return typeof e==='string'?1:e.lv; }
function getExercise(lvNum, slotIdx) {
  const slot = EXERCISES[lvNum-1][slotIdx];
  const chosen = st.chosen[lvNum-1][slotIdx] || 0;
  return slot.options[chosen];
}

function changeMonth(dir) { st.calOff+=dir; renderCal(); }
function renderCal() {
  const now=new Date();
  const tg=new Date(now.getFullYear(),now.getMonth()+st.calOff,1);
  const y=tg.getFullYear(); const m=tg.getMonth();
  const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-month-label').textContent=`${months[m]} ${y}`;
  const fd=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate();
  const g=document.getElementById('cal-grid'); g.innerHTML='';
  ['D','S','T','Q','Q','S','S'].forEach(n=>{const el=document.createElement('div');el.className='cal-dn';el.textContent=n;g.appendChild(el);});
  for(let i=0;i<fd;i++){const el=document.createElement('div');el.className='cal-day';g.appendChild(el);}
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(let d=1;d<=dim;d++){
    const el=document.createElement('div');el.className='cal-day';el.textContent=d;
    if(isToday(y,m,d)) el.classList.add('today');
    const lv=getDoneLv(y,m,d); if(lv) el.classList.add(`lv${lv}`);
    if(editMode){
      const thisDay=new Date(y,m,d);
      if(thisDay>today){ el.classList.add('editable','future'); }
      else { el.classList.add('editable'); const dd=d; el.onclick=()=>openDayModal(y,m,dd); }
    }
    g.appendChild(el);
  }
}

function updateHome() {
  const t=total(); const lv=getLv();
  document.getElementById('total-count').textContent=t;
  document.getElementById('level-count').textContent=lv.num;
  let streak=0; const now=new Date();
  for(let i=0;i<365;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);if(getDoneLv(d.getFullYear(),d.getMonth(),d.getDate()))streak++;else break;}
  document.getElementById('streak-count').textContent=streak;
  document.getElementById('level-badge-wrap').innerHTML=`<div class="level-badge ${lv.badge}">${lv.emoji} Nível ${lv.num} — ${lv.name}</div>`;
  const fill=document.getElementById('level-fill'); fill.className=`level-bar-fill ${lv.bar}`;
  const range=lv.max-lv.min; const done=t-lv.min;
  fill.style.width=(lv.num===4?100:Math.min(100,Math.round((done/range)*100)))+'%';
  document.getElementById('level-hint').textContent=lv.num<4?`${Math.max(0,lv.max-t)} treinos para o nível ${lv.num+1}`:'Você chegou ao nível máximo! 🏆';
  // Start button: check if there's a session to resume
  const session = loadSession();
  const btn = document.getElementById('start-btn');
  const label = document.getElementById('start-btn-label');
  if (session) {
    btn.className = 'start-btn resume';
    if(label) label.textContent = 'Continuar treino de hoje ▶';
  } else {
    btn.className = 'start-btn';
    if(label) label.textContent = 'Começar treino de hoje';
  }
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startWorkout(){
  const session = loadSession();
  if (session) {
    // Resume same-day workout
    st.ex = session.ex;
    st.sets = session.sets;
    st.chosen = session.chosen;
    st.t0 = session.t0;
  } else {
    // Fresh start
    const lv = getLv();
    st.ex = 0;
    st.sets = EXERCISES[lv.num-1].map(()=>[]);
    st.t0 = Date.now();
  }
  st.inProgress = true;
  show('screen-workout'); renderEx();
}

function goHome(){
  st.inProgress = false;
  if (st.t0 !== null) saveSession();
  show('screen-home'); renderCal(); updateHome();
}

// Muscle label overlay colors per muscle group
const MUSCLE_COLOR = {
  'Glúteo': '#1D9E75', 'Perna': '#1D9E75', 'Quadríceps': '#1D9E75', 'Adutores': '#0F6E56',
  'Posterior': '#1D9E75', 'Panturrilha': '#1D9E75',
  'Peito': '#378ADD', 'Costas': '#1D9E75', 'Lombar': '#5DCAA5',
  'Ombro': '#EF9F27', 'Bíceps': '#1D9E75', 'Tríceps': '#D4537E',
  'Abdômen': '#1D9E75', 'Oblíquos': '#D4537E', 'Core': '#1D9E75',
};

function getMuscleColor(muscle) {
  for (const [k, v] of Object.entries(MUSCLE_COLOR)) {
    if (muscle.includes(k)) return v;
  }
  return '#1D9E75';
}

function getMuscleSVG(muscle) {
  const img = MUSCLE_IMG[muscle] || MUSCLE_IMG[Object.keys(MUSCLE_IMG).find(k => muscle.includes(k.split('+')[0].trim())) || 'Abdômen'];
  const color = getMuscleColor(muscle);
  return `<img src="${img}" alt="${muscle}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'">
    <div class="muscle-img-label">${muscle}</div>`;
}

function renderEx(){
  const lv=getLv(); const idx=st.ex; const total=EXERCISES[lv.num-1].length;
  const ex=getExercise(lv.num, idx);
  document.getElementById('workout-prog').textContent=`${idx+1} / ${total}`;
  const bar=document.getElementById('progress-bar'); bar.style.width=`${((idx+1)/total)*100}%`; bar.style.background=lv.barColor;
  const ms=document.getElementById('ex-muscle'); ms.className=`ex-muscle-tag ${lv.muscle}`; ms.textContent=ex.muscle;
  document.getElementById('ex-name').textContent=ex.name;
  document.getElementById('ex-desc').textContent=ex.desc;
  document.getElementById('ex-tip').textContent=ex.tip||'';
  // Embed YouTube iframe — usuário toca play dentro do app
  const ytId = ex.yt || '';
  if (ytId) {
    document.getElementById('video-area').innerHTML=`<iframe
      src="https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1&playsinline=1"
      title="${ex.name}"
      allow="encrypted-media; picture-in-picture"
      allowfullscreen
      style="width:100%;height:100%;border:none;display:block;border-radius:var(--radius)">
    </iframe>`;
  } else {
    document.getElementById('video-area').innerHTML=`
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px;flex-direction:column;gap:8px">
        <i class="ti ti-dumbbell" style="font-size:28px"></i>
        <span>Siga a descrição abaixo</span>
      </div>`;
  }
  document.getElementById('muscle-svg-wrap').innerHTML=getMuscleSVG(ex.muscle);

  // Swap button — locked after workout starts (only available before starting first exercise)
  const swapBtn = document.getElementById('swap-btn');
  if (swapBtn) {
    const isFirstEx = idx === 0;
    swapBtn.style.opacity = isFirstEx ? '1' : '0.4';
    swapBtn.style.pointerEvents = isFirstEx ? 'auto' : 'none';
    swapBtn.title = isFirstEx ? '' : 'Troca disponível antes de iniciar o treino';
  }

  const nl=document.getElementById('next-list'); nl.innerHTML='';
  for(let i=idx+1;i<Math.min(idx+5,total);i++){
    const slot=EXERCISES[lv.num-1][i];
    const nex=getExercise(lv.num,i);
    const thumbUrl = nex.yt ? `https://img.youtube.com/vi/${nex.yt}/default.jpg` : '';
    const item=document.createElement('div'); item.className='next-item';
    const optsBtnHtml = slot.options.map((opt,oi)=>{
      const chosen = st.chosen[lv.num-1][i]||0;
      const isChosen = oi===chosen;
      const optThumb = opt.yt ? `https://img.youtube.com/vi/${opt.yt}/default.jpg` : '';
      const thumbHtml = optThumb
        ? `<img src="${optThumb}" alt="${opt.name}" style="width:34px;height:26px;border-radius:4px;object-fit:cover">`
        : `<span style="font-size:14px">💪</span>`;
      return `<button class="next-opt-btn${isChosen?' active':''}" onclick="quickSwap(${i},${oi})" title="${opt.name}">${thumbHtml}</button>`;
    }).join('');
    item.innerHTML=`
      <div class="next-thumb">${thumbUrl ? `<img src="${thumbUrl}" alt="${nex.name}">` : `<span style="font-size:18px">💪</span>`}</div>
      <div style="flex:1;min-width:0">
        <div class="next-name">${nex.name}</div>
        <div class="next-sub">${nex.muscle} · ${lv.sets}×${lv.reps}</div>
        <div class="next-opts">${optsBtnHtml}</div>
      </div>`;
    nl.appendChild(item);
  }
  if(!nl.innerHTML) nl.innerHTML='<div style="font-size:13px;color:var(--text3);padding:6px 0">Último exercício!</div>';
  const btn=document.getElementById('next-btn'); btn.className=`action-btn ${lv.btn}`;
  if(idx===total-1){btn.innerHTML='Concluir treino <i class="ti ti-check"></i>';btn.onclick=concludeWorkout;}
  else{btn.innerHTML='Próximo <i class="ti ti-arrow-right"></i>';btn.onclick=nextExercise;}
}

function toggleSet(ei,sn){const s=st.sets[ei];const p=s.indexOf(sn);if(p>=0)s.splice(p,1);else s.push(sn);saveSession();renderEx();}
function nextExercise(){const lv=getLv();if(st.ex<EXERCISES[lv.num-1].length-1){st.ex++;saveSession();renderEx();window.scrollTo(0,0);}}

// Quick swap from next-list (before exercise is done)
function quickSwap(slotIdx, optIdx) {
  const lv=getLv();
  st.chosen[lv.num-1][slotIdx]=optIdx;
  saveSession(); renderEx();
}

// ── Swap modal ──
function openSwap(){
  const lv=getLv(); const idx=st.ex;
  const slot=EXERCISES[lv.num-1][idx];
  const currentChosen=st.chosen[lv.num-1][idx]||0;
  st.swapIdx=idx; st.swapChosen=currentChosen;
  const list=document.getElementById('alt-list'); list.innerHTML='';
  slot.options.forEach((opt,i)=>{
    const div=document.createElement('div');
    div.className='alt-option'+(i===currentChosen?' selected':'');
    const thumbUrl = opt.yt ? `https://img.youtube.com/vi/${opt.yt}/mqdefault.jpg` : '';
    div.innerHTML=`
      <div class="alt-thumb">
        ${thumbUrl ? `<img src="${thumbUrl}" alt="${opt.name}" onerror="this.parentElement.innerHTML='<span style=font-size:20px>💪</span>'">` : `<span style="font-size:20px">💪</span>`}
      </div>
      <div class="alt-info">
        <div class="alt-name">${opt.name}${i===0?' <span style="font-size:10px;color:var(--text3)">(padrão)</span>':''}</div>
        <div class="alt-muscle">${opt.muscle}</div>
      </div>
      <i class="ti ti-check alt-check"></i>`;
    div.onclick=()=>selectAlt(i);
    list.appendChild(div);
  });
  const confirmBtn=document.getElementById('modal-confirm-btn');
  confirmBtn.className=`modal-confirm ${lv.btn}`;
  document.getElementById('swap-modal').classList.add('open');
}

function selectAlt(i){
  st.swapChosen=i;
  document.querySelectorAll('.alt-option').forEach((el,idx)=>{
    el.className='alt-option'+(idx===i?' selected':'');
  });
}

function confirmSwap(){
  const lv=getLv();
  st.chosen[lv.num-1][st.swapIdx]=st.swapChosen;
  st.sets[st.swapIdx]=[];
  closeSwap(); renderEx();
}

function closeSwap(){document.getElementById('swap-modal').classList.remove('open');}
function closeSwapOutside(e){if(e.target===document.getElementById('swap-modal'))closeSwap();}

function concludeWorkout(){
  const lv=getLv(); const k=todayKey();
  const already=st.done.find(e=>(typeof e==='string'?e:e.k)===k);
  if(!already){st.done.push({k,lv:lv.num});save();}
  const t0saved = st.t0;
  clearSession(); st.t0=null; st.inProgress=false;
  const newLv=getLv(); const leveled=newLv.num>lv.num;
  const elapsed=t0saved?Math.round((Date.now()-t0saved)/60000)||1:30;
  const exs=EXERCISES[lv.num-1];
  document.getElementById('dn-ex').textContent=exs.length;
  document.getElementById('dn-sets').textContent=lv.sets*exs.length;
  document.getElementById('dn-reps').textContent=lv.sets*lv.reps*exs.length;
  document.getElementById('dn-time').textContent=elapsed;
  // Emoji per level
  const emojis=['🌸','💪','🔥','⚡'];
  document.getElementById('done-emoji').textContent = leveled ? '🎉' : emojis[lv.num-1];
  const banner=document.getElementById('levelup-banner');
  if(leveled){banner.innerHTML=`<div class="levelup-banner"><div class="lu-title">🎉 Subiu para o Nível ${newLv.num}!</div><div class="lu-sub">${newLv.emoji} ${newLv.name} — novos desafios te esperam!</div></div>`;}
  else banner.innerHTML='';
  const arr = CONGRATS[lv.num-1];
  const msg = arr[Math.floor(Math.random()*arr.length)];
  document.getElementById('done-sub').textContent=msg;
  show('screen-done');
}

function finishAndGoHome(){
  const btn = document.getElementById('start-btn-label');
  if (btn) btn.textContent = 'Começar treino de hoje';
  goHome();
}

let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('edit-cal-btn');
  const lbl = document.getElementById('edit-btn-label');
  const hint = document.getElementById('edit-hint');
  if (editMode) {
    btn.classList.add('editing');
    lbl.textContent = 'concluir';
    hint.style.display = 'block';
  } else {
    btn.classList.remove('editing');
    lbl.textContent = 'editar';
    hint.style.display = 'none';
  }
  renderCal();
}

function openDayModal(y, m, d) {
  if (!editMode) return;
  const now = new Date();
  const isFuture = new Date(y, m, d) > new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (isFuture) return;

  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const doneLv = getDoneLv(y, m, d);

  document.getElementById('day-modal-date').textContent = `${d} de ${months[m]} de ${y}`;
  const statusEl = document.getElementById('day-modal-status');
  const btnsEl = document.getElementById('day-modal-btns');

  if (doneLv) {
    const lvName = LEVELS[doneLv-1].name;
    statusEl.textContent = `✅ Treino de nível ${doneLv} (${lvName}) registrado neste dia.`;
    btnsEl.innerHTML = `<button class="day-del-btn" onclick="removeDay(${y},${m},${d})"><i class="ti ti-trash"></i> Remover treino deste dia</button>`;
  } else {
    statusEl.textContent = 'Nenhum treino registrado neste dia.';
    const lv = getLv();
    btnsEl.innerHTML = LEVELS.map(l =>
      `<button class="day-add-btn ${l.btn}" onclick="addDay(${y},${m},${d},${l.num})"><i class="ti ti-plus"></i> Adicionar como nível ${l.num} — ${l.name}</button>`
    ).join('');
  }

  document.getElementById('day-modal').classList.add('open');
}

function addDay(y, m, d, lvNum) {
  const k = `${y}-${m}-${d}`;
  const already = st.done.find(e => (typeof e==='string'?e:e.k) === k);
  if (!already) { st.done.push({k, lv: lvNum}); save(); }
  closeDayModal();
  renderCal(); updateHome();
}

function removeDay(y, m, d) {
  const k = `${y}-${m}-${d}`;
  st.done = st.done.filter(e => (typeof e==='string'?e:e.k) !== k);
  save();
  closeDayModal();
  renderCal(); updateHome();
}

function closeDayModal() { document.getElementById('day-modal').classList.remove('open'); }
function closeDayModalOutside(e) { if (e.target === document.getElementById('day-modal')) closeDayModal(); }



st.done=st.done.map(e=>typeof e==='string'?{k:e,lv:1}:e);
renderCal(); updateHome();

  const session = loadSession();
  if (session) {
    const btn = document.getElementById('start-btn-label');
    if (btn) btn.textContent = 'Continuar treino de hoje ▶';
  }
})();
